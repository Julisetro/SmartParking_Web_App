# Nombre del flujo de trabajo que se mostrará en la pestaña "Actions" de GitHub
name: CI Linter Checks

# Configura cuándo se debe ejecutar este flujo de trabajo
on:
  # Se ejecuta en cada push a la rama 'develop'
  push:
    branches: ["develop"]
  # También se ejecuta cuando se crea o actualiza un Pull Request dirigido a 'main' o 'develop'
  pull_request:
    branches: ["main", "develop"]

# Define los trabajos (jobs) que se ejecutarán en paralelo
jobs:
  # Primer trabajo: verificar el código del frontend
  frontend-linter:
    # El tipo de máquina virtual en la que se ejecutará el trabajo (Ubuntu es rápido y gratuito)
    runs-on: ubuntu-latest

    # Los pasos que componen el trabajo
    steps:
      # 1. Descarga una copia de tu repositorio en la máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura el entorno de Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Instala las dependencias del frontend de forma segura
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      # 4. Ejecuta el script de linting del frontend
      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

  # Segundo trabajo: verificar el código del backend
  backend-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .
